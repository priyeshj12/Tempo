# Deploys the places proxy (worker/) to Cloudflare Workers.
# Needs repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID,
# GOOGLE_PLACES_KEY and, for activities and sightseeing, TRIPADVISOR_KEY.

name: Deploy the places proxy

on:
  push:
    paths:
      - 'worker/**'
      - '.github/workflows/worker.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the Cloudflare settings
        id: cf
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Add the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets to deploy the places proxy."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ok == 'true'
        with:
          node-version: 22

      - name: Deploy the worker
        if: steps.cf.outputs.ok == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 deploy

      - name: Store the API keys in the worker
        if: steps.cf.outputs.ok == 'true'
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
          TRIPADVISOR_KEY: ${{ secrets.TRIPADVISOR_KEY }}
        run: |
          if [ -n "$GOOGLE_PLACES_KEY" ]; then printf '%s' "$GOOGLE_PLACES_KEY" | npx --yes wrangler@4 secret put GOOGLE_PLACES_KEY; fi
          if [ -n "$TRIPADVISOR_KEY" ]; then printf '%s' "$TRIPADVISOR_KEY" | npx --yes wrangler@4 secret put TRIPADVISOR_KEY; fi
